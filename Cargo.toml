[package]
name = "just_music"
version = "0.1.0"
edition = "2024"
description = "Small, fast, no-nonsense music player for Windows"

[dependencies]
rodio = { version = "0.23", default-features = false, features = [
    "playback",
    "flac",
    "mp3",
    "mp4",
    "vorbis",
    "wav",
] }
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
